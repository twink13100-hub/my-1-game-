
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CrashDrive 3D APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    container:
      image: barichello/godot-ci:4.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -eu
          apt-get update
          apt-get install -y openjdk-17-jdk wget unzip ca-certificates coreutils

      - name: Configure Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for candidate in \
              /opt/android-sdk \
              /opt/android-sdk-linux \
              /root/android-sdk \
              /usr/lib/android-sdk
            do
              if [ -d "$candidate" ]; then
                SDK="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            env | grep -E 'ANDROID|JAVA_HOME' || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK"
          java -version
          godot --version

      - name: Install Android SDK packages
        timeout-minutes: 12
        run: |
          set -eu

          SDKMANAGER="$(find "$ANDROID_HOME" \
            -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -maxdepth 6 \
              -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK packages ready."

      - name: Validate project
        run: |
          set -eu

          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn

          grep -q 'name="Android"' export_presets.cfg
          grep -q 'run/main_scene="res://scenes/Main.tscn"' project.godot

          echo "Project files OK."

      - name: Install Godot export templates
        timeout-minutes: 6
        run: |
          set -eu

          VERSION="4.5.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$VERSION"

          mkdir -p "$TEMPLATE_DIR"

          if [ ! -s "$TEMPLATE_DIR/android_source.zip" ] || \
             [ ! -s "$TEMPLATE_DIR/android_debug.apk" ] || \
             [ ! -s "$TEMPLATE_DIR/android_release.apk" ]; then

            wget --timeout=45 --tries=3 \
              -O /tmp/godot-templates.tpz \
              "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz"

            mkdir -p /tmp/godot-templates
            unzip -oq /tmp/godot-templates.tpz \
              -d /tmp/godot-templates

            test -s /tmp/godot-templates/templates/android_source.zip
            test -s /tmp/godot-templates/templates/android_debug.apk
            test -s /tmp/godot-templates/templates/android_release.apk

            cp /tmp/godot-templates/templates/* "$TEMPLATE_DIR/"
          fi

          echo "Godot export templates ready."

      - name: Import project resources
        timeout-minutes: 8
        run: |
          set -eu

          timeout 420s godot \
            --headless \
            --editor \
            --path . \
            --import

          echo "Project import finished."

      - name: Configure Android signing
        run: |
          set -eu

          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair \
            -keystore /tmp/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          SETTINGS="$HOME/.config/godot/editor_settings-4.5.tres"

          if [ ! -f "$SETTINGS" ]; then
            echo "ERROR: Godot editor settings file not found."
            exit 1
          fi

          cat >> "$SETTINGS" <<EOF

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Android build template
        timeout-minutes: 8
        run: |
          set -eu

          echo "Checking Godot Android source template..."
          test -s "$HOME/.local/share/godot/export_templates/4.5.stable/android_source.zip"

          echo "Installing Android build template..."

          set +e
          timeout 420s godot \
            --headless \
            --verbose \
            --path . \
            --install-android-build-template \
            > /tmp/android-template.log 2>&1
          RESULT=$?
          set -e

          cat /tmp/android-template.log

          if [ "$RESULT" -ne 0 ]; then
            echo "Android template installation failed: $RESULT"
            exit "$RESULT"
          fi

          if [ ! -d android ]; then
            echo "ERROR: Android project directory was not created."
            exit 1
          fi

          echo "Android build template installation completed."

      - name: Export APK
        timeout-minutes: 20
        run: |
          set -eu

          mkdir -p build

          set +e
          timeout 1080s godot \
            --headless \
            --verbose \
            --path . \
            --export-debug "Android" build/CrashDrive3D.apk \
            > /tmp/godot-export.log 2>&1
          RESULT=$?
          set -e

          cat /tmp/godot-export.log

          if [ "$RESULT" -ne 0 ]; then
            echo "APK export failed: $RESULT"
            exit "$RESULT"
          fi

          test -s build/CrashDrive3D.apk

          echo "APK export successful:"
          ls -lh build/CrashDrive3D.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CrashDrive3D-Android-APK
          path: build/CrashDrive3D.apk
          if-no-files-found: error
          retention-days: 14
          
