
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Godot Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: barichello/godot-ci:4.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eu
          apt-get update
          apt-get install -y openjdk-17-jdk wget unzip ca-certificates coreutils

      - name: Configure Android SDK
        run: |
          set -eu

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "Using SDK: $SDK"
          java -version

      - name: Install Android SDK 35
        timeout-minutes: 10
        run: |
          set -eu

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 5 -type f \
              2>/dev/null | head -40 || true
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Check project
        run: |
          set -eu
          test -f project.godot
          test -f export_presets.cfg
          grep -q '^gradle_build/min_sdk=24$' export_presets.cfg
          grep -q '^gradle_build/target_sdk=35$' export_presets.cfg
          echo "Project configuration OK"

      - name: Install Godot export templates
        timeout-minutes: 5
        run: |
          set -eu

          VERSION="4.5.stable"
          DIR="$HOME/.local/share/godot/export_templates/$VERSION"
          mkdir -p "$DIR"

          if [ ! -f "$DIR/android_debug.apk" ] || \
             [ ! -f "$DIR/android_release.apk" ] || \
             [ ! -f "$DIR/android_source.zip" ]; then
            wget --timeout=30 --tries=3 \
              -O /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz"

            mkdir -p /tmp/godot-templates
            unzip -oq /tmp/templates.tpz -d /tmp/godot-templates

            test -f /tmp/godot-templates/templates/android_debug.apk
            test -f /tmp/godot-templates/templates/android_release.apk
            test -f /tmp/godot-templates/templates/android_source.zip

            cp /tmp/godot-templates/templates/* "$DIR/"
          fi

      - name: Import Godot project
        timeout-minutes: 3
        run: |
          set -eu
          timeout 150s godot --headless --editor --path . --quit

      - name: Configure Android signing
        run: |
          set -eu

          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair \
            -keystore /tmp/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          SETTINGS="$HOME/.config/godot/editor_settings-4.5.tres"

          test -f "$SETTINGS"

          cat >> "$SETTINGS" <<EOF

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Android build template
        timeout-minutes: 4
        run: |
          set -eu

          timeout 180s godot \
            --headless \
            --verbose \
            --path . \
            --install-android-build-template

          test -d android/build

      - name: Export APK
        timeout-minutes: 10
        run: |
          set -eu
          mkdir -p build

          timeout 540s godot \
            --headless \
            --verbose \
            --path . \
            --export-debug "Android" build/CrashDrive3D.apk

          test -s build/CrashDrive3D.apk
          ls -lh build/CrashDrive3D.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CrashDrive3D-Android-APK
          path: build/CrashDrive3D.apk
          if-no-files-found: error
          retention-days: 14
          
